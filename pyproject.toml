[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "voltagegpu-cli"
version = "1.3.1"
description = "VoltageGPU CLI and Python SDK: deploy Confidential VMs (Intel TDX) and standard GPU pods, SSH in, stop them, check your balance."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "VoltageGPU (VOLTAGE EI)", email = "contact@voltagegpu.com" }]
keywords = [
  "gpu",
  "confidential-computing",
  "intel-tdx",
  "attestation",
  "cli",
  "sdk",
  "ssh",
  "pytorch",
  "voltagegpu",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "click>=8.1",
  "httpx>=0.27,<1",
  "rich>=13.0",
]

[project.optional-dependencies]
verify = ["voltage-verify>=0.2.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1.2", "twine>=5"]

[project.scripts]
voltagegpu = "volt.cli.main:main"
volt = "volt.cli.main:main"

[project.urls]
Homepage = "https://voltagegpu.com"
Documentation = "https://docs.voltagegpu.com/cli"
"API reference" = "https://docs.voltagegpu.com/api-reference"
Source = "https://github.com/VoltageGPU/VOLTAGEGPU-CLI/tree/release/1.3"
Changelog = "https://github.com/VoltageGPU/VOLTAGEGPU-CLI/blob/release/1.3/CHANGELOG.md"
Issues = "https://github.com/VoltageGPU/VOLTAGEGPU-CLI/issues"

[tool.hatch.build.targets.wheel]
packages = ["volt"]

[tool.hatch.build.targets.sdist]
include = ["/volt", "/tests", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]
exclude = ["__pycache__", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits the production API with VOLT_API_KEY (skipped unless VOLT_LIVE=1)"]

[tool.ruff]
line-length = 145
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "W"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.coverage.run]
source = ["volt"]
branch = true
